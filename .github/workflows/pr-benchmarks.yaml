name: PR Benchmarks

# Per-PR benchmark delta (#245): runs DateTimeExtensionsBenchmarks (the whole
# public surface - fourteen methods, all sub-microsecond) on the PR's HEAD AND
# on the base commit, compares the BenchmarkDotNet JSON, and posts (replaces)
# a delta-table comment on the PR.
#
# Gate policy (matches Log-Compressor's fleet-validated pr-benchmarks.yaml):
# allocated bytes per operation are deterministic, so an allocation regression
# beyond x1.5 FAILS the job unless the PR carries the
# `perf-impact-acknowledged` label. Wall-clock deltas are advisory only -
# shared-runner timing is too noisy to block on. The full benchmark run stays
# in benchmarks.yaml (weekly gh-pages chart); this workflow is the per-PR
# forward-looking signal, path-filtered to perf-relevant changes.
#
# NOTE: the label snapshot comes from the triggering event - after adding the
# label, re-trigger with a push (or close/reopen), not `gh run rerun`, which
# replays the stale snapshot.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/pr-benchmarks.yaml'
      - 'scripts/compare-benchmarks.py'

permissions:
  contents: read

concurrency:
  group: pr-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-delta:
    name: Benchmark delta vs base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write   # post/replace the delta comment
    steps:
      - name: Checkout (full history for base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check the PR tree has the benchmark class and compare script
        id: smoke
        # A PR whose tree predates the benchmarks project OR the compare
        # script (e.g. a protected-file split branched from an older main -
        # this workflow's own introduction is one, until its stacked
        # follow-up merges) has nothing to measure - skip instead of letting
        # the BDN filter match nothing, or the later `cp` of the script, fail.
        run: |
          if [ -f benchmarks/Wolfgang.Extensions.DateTime.Benchmarks/DateTimeExtensionsBenchmarks.cs ] && \
             [ -f scripts/compare-benchmarks.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR tree has no DateTimeExtensionsBenchmarks and/or compare-benchmarks.py - skipping benchmark delta."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks on PR (as-if-merged)
        if: steps.smoke.outputs.present == 'true'
        run: |
          dotnet run -c Release \
            --project benchmarks/Wolfgang.Extensions.DateTime.Benchmarks/Wolfgang.Extensions.DateTime.Benchmarks.csproj \
            -- --filter '*DateTimeExtensionsBenchmarks*' --job short --memory \
            --exporters json --artifacts "$RUNNER_TEMP/bdn-head"

      - name: Run benchmarks on base
        id: base
        if: steps.smoke.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Keep the compare script from the PR side before switching trees.
          cp scripts/compare-benchmarks.py "$RUNNER_TEMP/compare.py"

          git checkout --force "$BASE_SHA"

          if [ ! -f benchmarks/Wolfgang.Extensions.DateTime.Benchmarks/DateTimeExtensionsBenchmarks.cs ]; then
            echo "::notice::Base commit has no DateTimeExtensionsBenchmarks - first delta run has no baseline; skipping comparison."
            echo "baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "baseline=true" >> "$GITHUB_OUTPUT"

          dotnet run -c Release \
            --project benchmarks/Wolfgang.Extensions.DateTime.Benchmarks/Wolfgang.Extensions.DateTime.Benchmarks.csproj \
            -- --filter '*DateTimeExtensionsBenchmarks*' --job short --memory \
            --exporters json --artifacts "$RUNNER_TEMP/bdn-base"

      - name: Compare and gate
        id: compare
        if: steps.base.outputs.baseline == 'true'
        env:
          ACKNOWLEDGED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-impact-acknowledged') }}
        run: |
          head_json=$(find "$RUNNER_TEMP/bdn-head/results" -name '*-report*.json' | head -1)
          base_json=$(find "$RUNNER_TEMP/bdn-base/results" -name '*-report*.json' | head -1)

          set +e
          python3 "$RUNNER_TEMP/compare.py" "$base_json" "$head_json" "$RUNNER_TEMP/delta.md"
          result=$?
          set -e

          if [ "$result" -ne 0 ] && [ "$ACKNOWLEDGED" = "true" ]; then
            echo "::warning::Allocation gate exceeded, but the PR carries perf-impact-acknowledged - passing."
            printf '\n**Allocation gate exceeded - accepted via the perf-impact-acknowledged label.**\n' >> "$RUNNER_TEMP/delta.md"
            result=0
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Post (replace) the delta comment
        if: always() && steps.smoke.outputs.present == 'true' && steps.base.outputs.baseline == 'true' && steps.compare.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One rolling comment per PR, identified by the marker the compare
          # script writes as its first line.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- pr-benchmarks -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@"$RUNNER_TEMP/delta.md" > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@"$RUNNER_TEMP/delta.md" > /dev/null
          fi

      - name: Fail on gated regression
        if: steps.smoke.outputs.present == 'true' && steps.base.outputs.baseline == 'true' && steps.compare.outputs.result != '0'
        run: |
          echo "::error::Allocation regression beyond the gate - see the PR comment. Label the PR perf-impact-acknowledged (and re-push) to accept it deliberately."
          exit 1
