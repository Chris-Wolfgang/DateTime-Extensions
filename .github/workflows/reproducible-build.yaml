name: Reproducible Build

# Supply-chain hardening — build reproducibility. Determinism and reproducibility are
# not the same claim:
#
#  - deterministic: the same inputs on the same machine produce the same outputs.
#    Directory.Build.props already buys this (Roslyn is deterministic by default, and
#    ContinuousIntegrationBuild normalises embedded source paths when CI=true).
#  - reproducible: the same commit produces the same outputs in a DIFFERENT
#    environment — another OS, another checkout path, a cold machine.
#
# Only the second one supports a supply-chain claim ("this .nupkg really was built from
# this commit"), and only the second one can regress silently. This workflow builds the
# same commit three ways and compares SHA-256 fingerprints:
#
#   windows-a vs windows-b   same OS, two different checkout paths -> gated, everything must match
#   linux     vs windows-a   different OS -> gated on the compiled assemblies and symbols
#
# Cross-OS, the gate covers every .dll and .pdb: the per-TFM build outputs (net4* included)
# and the same files inside the .nupkg/.snupkg. Two inputs used to differ between Linux and
# Windows, and both are now removed:
#  - the SDK writes its generated sources (AssemblyInfo.cs, .AssemblyAttributes.cs,
#    GlobalUsings.g.cs) with the platform newline. The PDB hashes and embeds each one, and
#    the PDB checksum and MVID feed the DLL. Directory.Build.targets rewrites them to LF
#    before CoreCompile.
#  - net4* compiled against the installed targeting pack on Windows and the
#    Microsoft.NETFramework.ReferenceAssemblies package on Linux, different builds of the
#    same reference assemblies. Directory.Build.props now references the package on every OS,
#    which is also what lets the linux leg build (and pack) net4*.
# The other package entries (XML docs, .nuspec, OPC metadata) are still written with the
# platform newline by the compiler and NuGet; they carry no code and are reported, not gated.
# If the cross-OS gate fails, diff the PDB documents and referenced-assembly records first.
#
# What is deliberately NOT asserted: byte-identical .nupkg *container* bytes. A .nupkg is
# a zip and NuGet stamps every entry with its file mtime, so two packs of the same commit
# on the same machine seconds apart differ in the container while every entry inside is
# identical (measured 2026-09-24: 19/19 entries matched, containers did not). This
# workflow therefore fingerprints every entry inside the package, which is the part that
# carries the code. See REPRODUCIBLE-BUILD.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # FINGERPRINT: build the same commit in three environments and record hashes.
  # fail-fast is off so one environment's build failure still leaves the other
  # fingerprints to compare.
  # ============================================================================
  fingerprint:
    name: Fingerprint (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-a and windows-b differ ONLY in where the repo is checked out. An
          # absolute path leaking into a .dll or .pdb shows up here and nowhere else.
          - id: windows-a
            os: windows-latest
            path: checkout
          - id: windows-b
            os: windows-latest
            path: a/deliberately/much/deeper/checkout/path
          - id: linux
            os: ubuntu-latest
            path: checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ${{ matrix.path }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Fingerprint the build
        shell: pwsh
        working-directory: ${{ matrix.path }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Not a belt-and-braces check: with CI unset, ContinuousIntegrationBuild is off
          # and the checkout path is embedded verbatim, so windows-a and windows-b would
          # differ for a reason that says nothing about reproducibility.
          if ($env:CI -ne 'true')
          {
              throw 'CI is not "true" - ContinuousIntegrationBuild would be off and source paths would not be normalised.'
          }

          $lines = @("sdk=$(dotnet --version)")

          $projects = @(Get-ChildItem -Path src -Recurse -Filter *.csproj -File | Sort-Object Name)
          if ($projects.Count -eq 0)
          {
              throw 'No project found under src/.'
          }

          foreach ($project in $projects)
          {
              $match = [regex]::Match((Get-Content -LiteralPath $project.FullName -Raw), '<TargetFrameworks?>([^<]+)<')
              if (-not $match.Success)
              {
                  throw "No <TargetFramework(s)> element in $($project.Name)."
              }

              $tfms = @($match.Groups[1].Value -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })

              foreach ($tfm in $tfms)
              {
                  # net4* builds on every OS: Directory.Build.props references
                  # Microsoft.NETFramework.ReferenceAssemblies for src/ projects.
                  dotnet build $project.FullName -c Release -f $tfm --nologo
                  if ($LASTEXITCODE -ne 0)
                  {
                      throw "Build failed: $($project.Name) [$tfm]"
                  }

                  $outputDirectory = Join-Path $project.DirectoryName "bin/Release/$tfm"
                  $outputs = @(Get-ChildItem -Path (Join-Path $outputDirectory '*') -Include *.dll, *.pdb -File | Sort-Object Name)
                  if ($outputs.Count -eq 0)
                  {
                      throw "No assemblies under $outputDirectory."
                  }

                  foreach ($output in $outputs)
                  {
                      $hash = (Get-FileHash -LiteralPath $output.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                      $lines += "build $($project.BaseName)/$tfm/$($output.Name) $hash"
                  }
              }
          }

          foreach ($project in $projects)
          {
              dotnet pack $project.FullName -c Release -o packages --nologo
              if ($LASTEXITCODE -ne 0)
              {
                  throw "Pack failed: $($project.Name)"
              }
          }

          $sha256 = [System.Security.Cryptography.SHA256]::Create()

          foreach ($package in @(Get-ChildItem -Path (Join-Path 'packages' '*') -Include *.nupkg, *.snupkg -File | Sort-Object Name))
          {
              $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)

              try
              {
                  foreach ($entry in @($archive.Entries | Sort-Object FullName))
                  {
                      $stream = $entry.Open()

                      try
                      {
                          $hash = (($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString('x2') }) -join '')
                      }
                      finally
                      {
                          $stream.Dispose()
                      }

                      $lines += "pack $($package.Name)!$($entry.FullName) $hash"
                  }
              }
              finally
              {
                  $archive.Dispose()
              }
          }

          New-Item -ItemType Directory -Path fingerprint -Force | Out-Null
          Set-Content -LiteralPath 'fingerprint/fingerprint.txt' -Value $lines
          Write-Host "Recorded $($lines.Count - 1) fingerprint(s)."

      - name: Upload the fingerprint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fingerprint-${{ matrix.id }}
          path: ${{ matrix.path }}/fingerprint/fingerprint.txt
          if-no-files-found: error

  # ============================================================================
  # COMPARE: the actual gate. Any divergence fails with the list of outputs that
  # differ, not just a red X.
  # ============================================================================
  compare:
    name: Compare fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fingerprint
    # Not the default success(): a failed fingerprint leg would skip this job, and the
    # "that leg did not finish" diagnosis below would never be printed. The pairs whose
    # legs both finished are still compared.
    if: ${{ !cancelled() }}
    steps:
      - name: Download the fingerprints
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: fingerprint-*
          path: fingerprints

      - name: Compare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-Fingerprint([string] $id)
          {
              $path = "fingerprints/fingerprint-$id/fingerprint.txt"
              if (-not (Test-Path -LiteralPath $path))
              {
                  $script:failures += "Missing the fingerprint for '$id' - that leg of the matrix did not finish."
                  return $null
              }

              $sdk = $null
              $hashes = @{}

              foreach ($line in (Get-Content -LiteralPath $path))
              {
                  if ($line -match '^sdk=(.+)$')
                  {
                      $sdk = $Matches[1]
                      continue
                  }

                  $parts = $line -split ' '
                  $hashes[($parts[0] + ' ' + $parts[1])] = $parts[2]
              }

              return [pscustomobject]@{ Id = $id; Sdk = $sdk; Hashes = $hashes }
          }

          # 'all' compares every key (same OS, must match exactly). 'assemblies' compares only
          # .dll/.pdb keys - the per-TFM build outputs and the same files inside the packages -
          # and 'other' the remaining package entries (XML docs, .nuspec, OPC metadata), which
          # the compiler and NuGet write with the platform newline.
          function Test-KeyInScope([string] $key, [string] $scope)
          {
              $isAssembly = $key -match '\.(dll|pdb)$'
              switch ($scope)
              {
                  'all'        { return $true }
                  'assemblies' { return $isAssembly }
                  'other'      { return -not $isAssembly }
              }

              throw "Unknown scope '$scope'."
          }

          function Compare-Fingerprint($left, $right, [string] $scope, [string] $gated)
          {
              $leftKeys = @($left.Hashes.Keys | Where-Object { Test-KeyInScope $_ $scope })
              $rightKeys = @($right.Hashes.Keys | Where-Object { Test-KeyInScope $_ $scope })
              $shared = @($leftKeys | Where-Object { $right.Hashes.ContainsKey($_) } | Sort-Object)
              $problems = @()

              # Every leg builds and packs every TFM, so the output sets must match too.
              foreach ($key in @($leftKeys | Where-Object { -not $right.Hashes.ContainsKey($_) } | Sort-Object))
              {
                  $problems += "$($left.Id) produced '$key' and $($right.Id) did not."
              }

              foreach ($key in @($rightKeys | Where-Object { -not $left.Hashes.ContainsKey($_) } | Sort-Object))
              {
                  $problems += "$($right.Id) produced '$key' and $($left.Id) did not."
              }

              foreach ($key in $shared)
              {
                  if ($left.Hashes[$key] -ne $right.Hashes[$key])
                  {
                      $problems += "$key differs: $($left.Id)=$($left.Hashes[$key]) $($right.Id)=$($right.Hashes[$key])"
                  }
              }

              $result = if ($problems.Count -eq 0) { 'match' } else { "$($problems.Count) difference(s)" }
              $script:summary += "| $($left.Id) vs $($right.Id) ($scope) | $($shared.Count) | $result | $gated |"

              return $problems
          }

          $failures = @()
          $notes = @()
          $summary = @('| Comparison | Outputs compared | Result | Gated |', '|---|---|---|---|')

          # A missing leg is recorded as a failure by Read-Fingerprint; the pairs that did
          # finish are still compared below.
          $windowsA = Read-Fingerprint 'windows-a'
          $windowsB = Read-Fingerprint 'windows-b'
          $linux = Read-Fingerprint 'linux'

          # A runner that installed a different 10.0.x patch runs a different Roslyn, so
          # every hash differs for a reason that has nothing to do with this repository.
          # Say that and skip the pair, instead of printing forty mismatches.
          if ($windowsA -and $windowsB)
          {
              if ($windowsB.Sdk -ne $windowsA.Sdk)
              {
                  $failures += "SDK skew: windows-a built with $($windowsA.Sdk), windows-b with $($windowsB.Sdk). Hashes not compared - pin the SDK with a global.json."
                  $summary += '| windows-a vs windows-b | 0 | SDK skew, not compared | yes |'
              }
              else
              {
                  # Same OS, different checkout path: every output, and the output sets, identical.
                  $failures += Compare-Fingerprint $windowsA $windowsB 'all' 'yes'
              }
          }

          if ($linux -and $windowsA)
          {
              if ($linux.Sdk -ne $windowsA.Sdk)
              {
                  $failures += "SDK skew: windows-a built with $($windowsA.Sdk), linux with $($linux.Sdk). Hashes not compared - pin the SDK with a global.json."
                  $summary += '| linux vs windows-a | 0 | SDK skew, not compared | yes |'
              }
              else
              {
                  # Cross-OS: every .dll and .pdb must be byte-identical (see the header comment
                  # for the two inputs that used to differ). The remaining package entries carry
                  # no code and are reported only.
                  $failures += Compare-Fingerprint $linux $windowsA 'assemblies' 'yes'
                  $notes += Compare-Fingerprint $linux $windowsA 'other' 'no'
              }
          }

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($notes.Count -gt 0)
          {
              @('', '### Cross-OS package-metadata differences (not gated)', '',
                'Expected: XML docs, the .nuspec and the OPC metadata are written with the platform',
                'newline. They carry no code; the assemblies and symbols are gated above.', ''
              ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

              foreach ($note in $notes)
              {
                  Write-Host "::notice::$note"
                  "- $note" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              }
          }

          if ($failures.Count -gt 0)
          {
              @('', '### Divergence') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

              foreach ($failure in $failures)
              {
                  Write-Host "::error::$failure"
                  "- $failure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              }

              throw "This commit did not build reproducibly: $($failures.Count) problem(s)."
          }

          Write-Host 'Every output built twice on the same OS from different directories is byte-identical, and every assembly and symbol file is byte-identical across Windows and Linux.'
